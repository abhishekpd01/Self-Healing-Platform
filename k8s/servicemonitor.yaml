
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: employee-api
  namespace: default

  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: employee-api

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
